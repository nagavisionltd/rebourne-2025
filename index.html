        function drawPlayer() {
            ctx.save();
            if (player.invulnerable > 0 && Math.floor(Date.now() / 100) % 2) {
                ctx.globalAlpha = 0.5;
            }

            const animation = playerAnimations[player.currentAnimation];
            if (!animation) {
                console.error("Missing animation:", player.currentAnimation);
                ctx.restore();
                return;
            }

            const currentSprite = animation.spriteSheet[player.currentFrame]; 
            
            // Perspective scaling for Level 5
            let scale = 1.0;
            if (currentLevel === 5) {
                scale = getEntityScale(player.y);
                // Highway vibration
                const vibrationY = Math.sin(Date.now() / 40) * 1.5 * scale;
                ctx.translate(0, vibrationY);
                // Tilt bike up when jumping
                let tiltAngle = 0;
                if (player.state === "jumping" && player.currentAnimation === "bike") {
                    // Define lane positions (same as in Level 5 bike logic)
                    // Tilt up based on jump progress - maximum 15 degrees tilt
                    const jumpProgress = 1 - ((player.y - laneYPositions[player.lane]) / 150); // 0 when on ground, 1 at peak
                    tiltAngle = -15 * Math.sin(jumpProgress * Math.PI / 2); // Negative for tilting forward/up
                }
                if (tiltAngle !== 0) {
                    ctx.translate(player.x, player.y - h/2);
                    ctx.rotate(tiltAngle * Math.PI / 180);
                    ctx.translate(-player.x, -(player.y - h/2));
                }
            }
            
            const w = player.width * scale;
            const h = player.height * scale;

            if (currentSprite && currentSprite.complete && currentSprite.naturalWidth > 0) {
                // Handle facing direction
                if (player.facing === -1) {
                    ctx.translate(player.x + w / 2, player.y);
                    ctx.scale(-1, 1);
                    ctx.drawImage(currentSprite, -w / 2, -h, w, h);
                } else {
                    ctx.drawImage(currentSprite, player.x - w / 2, player.y - h, w, h);
                }
            } else {
                // Flash red if sprite is missing
                ctx.fillStyle = 'red';
                ctx.fillRect(player.x - w / 2, player.y - h, w, h);
            }
            
            // Debug Hitboxes
            if (showDebugHitboxes) {
                // Player body
                ctx.strokeStyle = 'cyan';
                ctx.lineWidth = 1;
                ctx.strokeRect(player.x - player.width/2, player.y - player.height, player.width, player.height);

                // Attack hitbox
                const animation = playerAnimations[player.currentAnimation] || playerAnimations['idle'];
                if (animation.hitboxes && animation.hitboxes[player.currentFrame]) {
                    const hb = animation.hitboxes[player.currentFrame];
                    const hitX = player.x + (hb.x * player.facing);
                    const hitY = player.y + hb.y;
                    ctx.strokeStyle = player.hitActive ? 'red' : 'yellow';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(hitX - hb.w/2, hitY - hb.h/2, hb.w, hb.h);
                }
            }
            
            // Special move visual glow
            if (player.state === 'special') {
                ctx.shadowBlur = 20;
                ctx.shadowColor = 'yellow';
                ctx.strokeStyle = 'white';
                ctx.lineWidth = 2;
                ctx.strokeRect(player.x - player.width / 2, player.y - player.height, player.width, player.height);
            }
            ctx.restore();
        }
        
        function drawLevel1Background() {
            // Draw a black background as a fallback
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (level1BackgroundImage.complete && level1BackgroundImage.naturalWidth > 0) {
                const bgWidth = level1BackgroundImage.naturalWidth;
                const bgHeight = level1BackgroundImage.naturalHeight;

                // Scale the image to fit the canvas height, maintaining aspect ratio
                const scale = canvas.height / bgHeight;
                const scaledWidth = bgWidth * scale;
                const scaledHeight = canvas.height;

                // Draw the background image statically (no parallax)
                ctx.drawImage(level1BackgroundImage, 
                    0, 0, 
                    scaledWidth, scaledHeight
                );
            }
        }

        function drawLevel2Background() {
            if (level2RooftopBackgroundImage.complete && level2RooftopBackgroundImage.naturalWidth > 0) {
                // Draw the rooftop image
                ctx.drawImage(level2RooftopBackgroundImage, 0, 0, canvas.width, canvas.height);
            } else {
                ctx.fillStyle = '#111';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            backgroundElements.forEach(el => el.draw());
        }

        function drawLevel3Background() {
            if (level3JungleBackgroundImage.complete && level3JungleBackgroundImage.naturalWidth > 0) {
                ctx.drawImage(level3JungleBackgroundImage, 0, 0, canvas.width, canvas.height);
            } else {
                ctx.fillStyle = '#2c3e50'; ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#8B4513'; ctx.fillRect(0, currentGroundLevel, canvas.width, canvas.height - currentGroundLevel);
            }
        }
        
        function drawLevel4Background() {
            if (level4SunsetBackgroundImage.complete && level4SunsetBackgroundImage.naturalWidth > 0) {
                ctx.drawImage(level4SunsetBackgroundImage, 0, 0, canvas.width, canvas.height);
            } else {
                ctx.fillStyle = '#5D6D7E'; ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#EAECEE'; ctx.fillRect(0, currentGroundLevel, canvas.width, canvas.height-currentGroundLevel);
            }
        }

        function drawLevel5Background() {
            // === FLAT HORIZONTAL HIGHWAY (side-scrolling) ===

            // 1. Night sky gradient
            const skyGrad = ctx.createLinearGradient(0, 0, 0, currentGroundLevel);
            skyGrad.addColorStop(0, '#05010d');
            skyGrad.addColorStop(0.6, '#120325');
            skyGrad.addColorStop(1.0, '#2a054a');
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, canvas.width, currentGroundLevel);

            // 2. Scrolling neon city skyline (parallax layer)
            ctx.save();
            const bOff = level5CityOffset % 380;
            const numB = Math.ceil(canvas.width / 140) + 2;
            for (let i = -1; i < numB; i++) {
                const bx = i * 140 - bOff;
                const bh = 90 + ((Math.abs(i) * 31) % 17) * 9;
                const bw = 70 + ((Math.abs(i) *  7) % 5)  * 14;
                ctx.fillStyle = '#120325';
                ctx.fillRect(bx, currentGroundLevel - bh, bw, bh);
                // Windows
                ctx.fillStyle = 'rgba(255,255,120,0.25)';
                for (let wy = currentGroundLevel - bh + 15; wy < currentGroundLevel - 15; wy += 20) {
                    for (let wx = bx + 10; wx < bx + bw - 10; wx += 16) {
                        if ((wx + wy + i) % 3 === 0) ctx.fillRect(wx, wy, 3, 3);
                    }
                }
            }
            ctx.restore();

            // 3. Road surface (flat, fills from currentGroundLevel to bottom)
            ctx.fillStyle = '#1a1d21';
            ctx.fillRect(0, currentGroundLevel, canvas.width, canvas.height - currentGroundLevel);

            // 4. Glowing road edge lines
            ctx.save();
            ctx.shadowBlur = 12; ctx.shadowColor = '#ff6600';
            ctx.strokeStyle = '#ff6600'; ctx.lineWidth = 3;
            ctx.beginPath(); ctx.moveTo(0, currentGroundLevel); ctx.lineTo(canvas.width, currentGroundLevel); ctx.stroke();
            ctx.shadowColor = '#ff3300';
            ctx.strokeStyle = '#ff3300'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(0, canvas.height - 4); ctx.lineTo(canvas.width, canvas.height - 4); ctx.stroke();
            ctx.restore();

            // 5. Scrolling dashed centre line
            ctx.save();
            ctx.fillStyle = 'rgba(255,255,255,0.75)';
            const dashW = 70, dashH = 8, gap = 60;
            const period = dashW + gap;
            const dashOff = level5RoadOffset % period;
            const laneY = currentGroundLevel + (canvas.height - currentGroundLevel) / 2 - dashH / 2;
            for (let x = -period + dashOff; x < canvas.width + period; x += period) {
                ctx.fillRect(x, laneY, dashW, dashH);
            }
            ctx.restore();
        }

        function drawLevel6Background() {
            ctx.fillStyle = '#1C1C1C'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = '#00ffff';
            ctx.lineWidth = 2;
            for(let i=0; i<20; i++) {
                ctx.beginPath();
                ctx.moveTo(Math.random()*canvas.width, 0);
                ctx.lineTo(Math.random()*canvas.width, canvas.height);
                ctx.stroke();
            }
            ctx.fillStyle = '#333'; ctx.fillRect(0, currentGroundLevel, canvas.width, canvas.height - currentGroundLevel);
        }

        function drawBeachBackground() {
            ctx.fillStyle = '#87CEEB'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#FFD700';
            ctx.beginPath(); ctx.arc(240, 180, 72, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#00BFFF'; ctx.fillRect(0, 450, canvas.width, canvas.height - 450);
            ctx.fillStyle = '#F0E68C'; ctx.fillRect(0, currentGroundLevel, canvas.width, canvas.height - currentGroundLevel);
        }

        function drawEndingScene() {
            cutsceneTimer -= 1000/60;
            drawBeachBackground();

            player.x = canvas.width / 2;
            player.y = currentGroundLevel;
            
            ctx.fillStyle = '#4444ff';
            ctx.fillRect(player.x - player.width/2, player.y - player.height, player.width, player.height);
            
            ctx.fillStyle = '#000000';
            ctx.fillRect(player.x - 15, player.y - 55, 30, 10);

            ctx.fillStyle = '#000000';
            ctx.font = '36px "Courier New", monospace';
            ctx.textAlign = 'center';
            ctx.fillText("Finally... free.", canvas.width / 2, 150);

            if (cutsceneTimer <= 0) {
                gameState = 'title';
                document.getElementById('titleScreen').style.display = 'flex';
                currentLevel = 0; 
            }
        }


        function gameLoop(currentTime) {
            const deltaTime = (currentTime - lastTime) / 1000;
            lastTime = currentTime;

            if (gameState === 'title') {
                 // The loop is running, but we wait for the user to click "Start Game"
            } else if (gameState === 'cutscene' && currentLevel === 0) {
                // Opening cutscene is handled by setTimeout in startOpeningCutscene
            } else if (gameState === 'ending') {
                drawEndingScene();
            } else if (gameState === 'playing') {
                handleInput(deltaTime);
                updatePlayer(deltaTime);
                if (npc) npc.update(deltaTime);

                if (currentLevel === 2 || currentLevel === 5) {
                    if (currentLevel === 2) {
                        backgroundElements.forEach(el => el.update(deltaTime, player.vx));
                        level2EnemySpawnTimer -= deltaTime * 1000;
                        if(level2EnemySpawnTimer <= 0 && enemiesToSpawnInLevel2 > 0) {
                            enemies.push(new Enemy(Math.random() * (canvas.width - 200) + 100, -50));
                            enemiesToSpawnInLevel2--;
                            level2EnemySpawnTimer = 3000 + Math.random() * 2000;
                        }
                    } else                if (currentLevel === 5) {
                    // Horizontal highway scroll offsets
                    level5RoadOffset += 500 * deltaTime;
                    level5CityOffset +=  40 * deltaTime;

                    // Define lanes for enemy spawning (matching player lanes)
                    const randomLane = laneYPositions[Math.floor(Math.random() * laneYPositions.length)];

                    // Spawn enemies from off-screen right at random lane
                    level2EnemySpawnTimer -= deltaTime * 1000;
                    if (level2EnemySpawnTimer <= 0 && enemiesToSpawnInLevel2 > 0) {
                        enemies.push(new Enemy(canvas.width + 100, randomLane));
                        enemiesToSpawnInLevel2--;
                        level2EnemySpawnTimer = 2000 + Math.random() * 2000;

                    // Spawn obstacles in random lanes
                    level5ObstacleSpawnTimer -= deltaTime * 1000;
                    if (level5ObstacleSpawnTimer <= 0) {                        const randomLane = laneYPositions[Math.floor(Math.random() * laneYPositions.length)];
                        // Spawn different types of obstacles
                        const obstacleTypes = ['barrel', 'roadblock', 'spikes'];
                        const obstacleType = obstacleTypes[Math.floor(Math.random() * obstacleTypes.length)];
                        environmentObjects.push(new EnvironmentObject(canvas.width + 100, randomLane, obstacleType));
                        level5ObstacleSpawnTimer = 1500 + Math.random() * 1000;
                    }
                    }
                }
                }


                projectiles.forEach((p, pIndex) => {
                    p.update(deltaTime);
                    let hit = false;
                    
                    if (currentLevel === 5) {
                        // 2.5D proximity laser collisions
                        if (p.type === 'enemy_bike_shot') {
                            if (Math.abs(p.y - player.y) < 25 && Math.abs(p.x - player.x) < 40 && player.invulnerable <= 0) {
                                player.health = Math.max(0, player.health - 8);
                                player.invulnerable = 500;
                                updateUI();
                                hit = true;
                                createParticles(player.x, player.y - 30 * getEntityScale(player.y), 'hit', 5);
                            }
                        } else if (p.type === 'bike_shot') {
                            [...enemies, levelBoss].filter(e => e).forEach((enemy) => {
                                if (Math.abs(p.y - enemy.y) < 25 && Math.abs(p.x - enemy.x) < 45) {
                                    if (enemy.takeDamage(10)) {
                                        if (enemy === levelBoss) {
                                            // Boss health check handled by checkLevelCompletion
                                        } else {
                                            enemies.splice(enemies.indexOf(enemy), 1);
                                        }
                                        createParticles(enemy.x, enemy.y - 30 * getEntityScale(enemy.y), 'explosion', 15);
                                    }
                                    hit = true;
                                }
                            });
                        }
                    } else {
                        // Normal level collisions
                        if (p.type === 'knife' && Math.abs(p.x - player.x) < 20 && Math.abs(p.y - (player.y - player.height/2)) < player.height/2) {
                            player.health = Math.max(0, player.health - 10);
                            player.invulnerable = 500; updateUI(); hit = true;
                        } else {
                             [...enemies, levelBoss].filter(e => e).forEach((enemy, eIndex) => {
                                if (Math.abs(p.x - enemy.x) < (p.width + enemy.width) / 2) {
                                    if (enemy.takeDamage(10) && enemy !== levelBoss) enemies.splice(eIndex, 1);
                                    hit = true;
                                }
                            });
                        }
                    }
                    
                    if (hit || p.x < -100 || p.x > canvas.width + 100 || p.y > 750) projectiles.splice(pIndex, 1);
                });
                
                environmentObjects.forEach(obj => {
                    if(obj.type === 'laser' && obj.active && Math.abs(player.x - (obj.x + obj.width/2)) < player.width/2) {
                        player.health = 0; updateUI(); // Instant death
                    }
                });

                enemies.forEach(e => e.update(deltaTime));
                if (levelBoss) levelBoss.update(deltaTime);
                
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                if (currentLevel === 1) drawLevel1Background();
                else if (currentLevel === 2) drawLevel2Background();
                else if (currentLevel === 3) drawLevel3Background();
                else if (currentLevel === 4) drawLevel4Background();
                else if (currentLevel === 5) drawLevel5Background();
                else if (currentLevel === 6) drawLevel6Background();
                
                // Standard flat rendering for all levels
                projectiles.forEach(p => p.draw());
                // Update and filter environment objects (obstacles)
                environmentObjects = environmentObjects.filter(obj => {
                    const result = obj.update(deltaTime);
                    return result !== 'remove'; // Keep if not removed
                });
                environmentObjects.forEach(obj => obj.draw());
                if(npc) npc.draw();
                enemies.forEach(e => e.draw());
                if (levelBoss) levelBoss.draw();
                drawPlayer();
                
                checkLevelCompletion();
            }
            
            requestAnimationFrame(gameLoop);
        }

        document.addEventListener('DOMContentLoaded', () => {
            const titleScreen = document.getElementById('titleScreen');
            if (titleScreen) {
                titleScreen.addEventListener('click', startGame);
            }
            setupMobileControls(); // Activate mobile controls
        });
    </script>
</body>
</html>
